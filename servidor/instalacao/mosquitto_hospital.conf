# hospital.conf: configuração do Mosquitto para o VitalMonitor (vai para /etc/mosquitto/conf.d/hospital.conf)
# Broker MQTT configurado para 200+ pulseiras simultâneas
# ─────────────────────────────────────────────────────────────

# Escutar em todas as interfaces, porta standard
listener 1883 0.0.0.0

# ── Autenticação ──────────────────────────────────────────────
# Criar passwords com:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd pulseira
#   sudo mosquitto_passwd    /etc/mosquitto/passwd worker
allow_anonymous false
password_file /etc/mosquitto/passwd

# ── Limites para 200+ clientes ────────────────────────────────
max_connections       500      # margem para 200 pulseiras + workers (o painel e os workers ligam-se com o utilizador worker)
max_inflight_messages 100      # mensagens QoS>0 pendentes por cliente
max_queued_messages   500      # fila por cliente quando offline

# Payload máximo: ~1800 bytes (25 amostras × 65 chars + overhead)
# Definir margem confortável
max_packet_size    8192

# Keep-alive: desligar clientes mortos ao fim de 1.5 × 30 s = 45 s
# (configurado no Arduino via client.setKeepAlive(30))

# ── Performance ───────────────────────────────────────────────
# Com QoS 0 (sensor data), persistence é desnecessária e reduz I/O
persistence false

# ── Logging (apenas erros em produção) ───────────────────────
log_dest   stdout
log_type   error
log_type   warning
# log_type information   # descomentar para debug
